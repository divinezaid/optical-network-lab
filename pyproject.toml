[project]
name = "optical-network-lab"
version = "0.1.0"
description = "Simulated optical network and automated verification suite"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest", "pytest-html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
